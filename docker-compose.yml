services:
  postgres:
    image: postgres:17
    container_name: documentsystem
    restart: unless-stopped
    environment:
      POSTGRES_DB: documentsystem
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d documentsystem"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: secure_password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
        test: rabbitmq-diagnostics -q ping
        interval: 30s
        timeout: 10s
        retries: 5
        start_period: 10s

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  api:
    build:
      context: .
      dockerfile: DocumentManagementSystem/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Host=postgres;Database=documentsystem;Username=postgres;Password=root
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=admin
      - RABBITMQ_PASS=secure_password
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      minio:
        condition: service_healthy

  ocr-worker:
    build:
      context: .
      dockerfile: OcrWorker/Dockerfile
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=admin
      - RABBITMQ_PASS=secure_password
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - TESSDATA_PREFIX=/usr/share/tesseract-ocr/5/tessdata
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  #indexing-worker:
   # build:
    #  context: .
     # dockerfile: IndexingWorker/Dockerfile
    #environment:
     # - RABBITMQ_HOST=rabbitmq
     # - RABBITMQ_USER=admin
     # - RABBITMQ_PASS=secure_password
     # - ELASTICSEARCH_URL=http://elasticsearch:9200
    #depends_on:
     # rabbitmq:
      #  condition: service_healthy
     # elasticsearch:
      #  condition: service_started

  frontend:
    build:
      context: ./DocumentManagementApp
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    volumes:
      - ./DocumentManagementApp:/usr/src/app
      - /usr/src/app/node_modules

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./DocumentManagementSystem/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
     - frontend

