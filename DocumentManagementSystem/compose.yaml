include:
  - ../DocumentManagementApp/compose.yaml

services:
  api:
    build:
      dockerfile: Dockerfile
    ports:
      - '5000:8080'
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=admin
      - RABBITMQ_PASS=secure_password
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - paperless

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.3.3
    ports:
      - "8000:8000"
    environment:
      PAPERLESS_CSRF_TRUSTED_ORIGINS: http://localhost:8080
      PAPERLESS_REDIS: redis://paperless-broker:6379
      PAPERLESS_SECRET_KEY: example123
      PAPERLESS_DBUSER: postgres
      PAPERLESS_DBPASS: root
    volumes:
      - paperless_data:/usr/src/paperless
    depends_on:
      - postgres
      - paperless-broker

  postgres:
    image: postgres:17
    container_name: documentsystem
    restart: unless-stopped
    environment:
      POSTGRES_DB: documentsystem
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d documentsystem"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  paperless-broker:
    image: redis:alpine

  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: secure_password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_log:/var/log/rabbitmq

volumes:
  postgres_data:
  paperless_data:
  rabbitmq_data:
  rabbitmq_log: